[package]
name = "m5remote-rust"
version = "0.1.0"
edition = "2021"
resolver = "2"
publish = false

[[bin]]
name = "m5remote-rust"
path = "src/main.rs"

[dependencies]
# 純Rustハードウェアスタック。m5unified crateは使わない。
# m5unifiedはESP-IDFの旧I2C driverを使うため、driver_ng系と同時linkできない。
axp192 = "0.2"
embedded-graphics = "0.8"
embedded-hal = "1.0"
embedded-hal-bus = "0.3"
embedded-svc = "0.28"
ft6x36 = "0.6"
mipidsi = "0.10"
# windows-agentと共有するHMAC署名wire protocol実装。
pc-remote-signing = { path = "../shared/pc-remote-signing" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "espidf")'.dependencies]
esp-idf-sys = { version = "0.36", default-features = false, features = ["std", "binstart"] }
esp-idf-svc = { version = "0.51", default-features = false, features = ["std"] }
esp-idf-hal = "0.45"

[build-dependencies]
embuild = { version = "0.33", features = ["espidf"] }
# Git管理外のconfig.tomlをビルド時に読む。host側で動くためesp-idf toolchainは不要。
toml = "0.8"

[package.metadata.esp-idf-sys]
esp_idf_version = "v5.3.2"

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

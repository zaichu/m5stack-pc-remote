# このファイルを同じディレクトリの config.toml へコピーし、値を書き換える。
# config.toml は .gitignore 対象なのでコミットしない。
#
# build.rs がビルド時に読み、$OUT_DIR/generated_config.rs を生成する。
# secretを src/ 配下のRustソースに直接置かないことで、警告ログへの漏えいを避ける。

wifi_ssid = "your-wifi-ssid"
wifi_password = "your-wifi-password"

pc_mac_address = "AA:BB:CC:DD:EE:FF"
wol_port = 9

# STATUS確認先。TCP connect probeを使う。接続成功または即時refusedなら
# 「PCは起動して到達可能」、timeoutなら「OFFまたは到達不能」と扱う。
# このportで何かがlistenしている必要はない。
pc_status_addr = "192.168.1.100:80"

# m5stack-pc-bridge。LAN内HTTP + HMAC-SHA256署名付きリクエスト。
bridge_port = 18080
bridge_shared_secret = "replace-with-the-same-secret-as-m5stack-pc-bridge"

# m5stack-pc-bridgeはSTATUS確認対象と同じPCで動かす。
pc_ip_address = "192.168.1.100"

# Telegram Bot API。外向きHTTPS long pollingで使う。
# placeholderのままならTelegram clientは無効になる。
telegram_bot_token = "replace-with-your-telegram-bot-token"
telegram_allowed_user_id = "replace-with-your-telegram-user-id"
telegram_long_poll_timeout_seconds = 20
telegram_confirm_ttl_secs = 60

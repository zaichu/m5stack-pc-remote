# このファイルを同じディレクトリの config.toml へコピーし、値を書き換える。
# config.toml は .gitignore 対象なのでコミットしない。

bind = "0.0.0.0:18080"

# firmware/config.toml の bridge_shared_secret と同じ値にする(HMAC-SHA256署名の検証に使う)。
# 32文字以上の長いランダム値にする。placeholderのままでは起動しない。
shared_secret = "replace-with-a-long-random-shared-secret"

allowed_skew_seconds = 60

# true の間は実際のshutdown/rebootを実行しない。実機確認が済むまでtrueのままにする。
dry_run = true

# 認証失敗が続いたときにTelegramへアラートを送る設定。両方揃ったときだけ有効になる。
# 省略した場合は通知しないだけで、電源操作の動作には影響しない。
#
# telegram_bot_token は firmware/config.toml と同じbot tokenでよい。このファイルへ
# tokenを置くことのリスク評価は docs/security.md を参照。
# telegram_chat_id は firmware側の telegram_allowed_user_id と同じ数値を入れる。
# telegram_bot_token = "replace-with-your-telegram-bot-token"
# telegram_chat_id = 123456789

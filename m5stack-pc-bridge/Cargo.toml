[package]
name = "m5stack-pc-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"

[dependencies]
anyhow = "1.0"
axum = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
dashmap = "6.1"
# firmware/と共有するHMAC署名wire protocol実装。
pc-remote-signing = { path = "../shared/pc-remote-signing" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
time = { version = "0.3", features = ["serde", "formatting"] }
tokio = { version = "1.39", features = ["macros", "net", "rt-multi-thread", "signal"] }
toml = "1.1"
tracing = "0.1"
ureq = { version = "3.4", default-features = false, features = ["rustls", "json"] }

[target.'cfg(not(windows))'.dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Windows Serviceとして動かすためのSCM連携。ホスト(Linux/CI)側のbuild/test/clippyは
# このcrateを引き込まないので、cfg(windows)以外の環境には影響しない。
[target.'cfg(windows)'.dependencies]
tokio = { version = "1.39", features = ["sync"] }
windows-service = "0.8"
# スリープ実行(`src/suspend.rs` の SetSuspendState と SeShutdownPrivilege 付与)と
# suspend_test診断バイナリで使う。ホスト側のbuildには影響しない。
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Power",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.10"
tower = "0.5"

[lints.cargo]
unused_dependencies = "warn"

[lints.clippy]
use_self = "warn"
missing_const_for_fn = "warn"
manual_let_else = "warn"
uninlined_format_args = "warn"
map_unwrap_or = "warn"
redundant_closure_for_method_calls = "warn"
option_if_let_else = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_lossless = "warn"

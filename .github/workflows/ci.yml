name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # gitleaks は `detect --source .` でgit履歴を走査する。既定の
          # shallow clone(depth 1)だと直近1コミットしか見ないため、
          # 過去に混入したsecretを検出できない。
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install mingw-w64 (m5stack-pc-bridge Windows Service cross-build)
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # scripts/scan-secrets.sh は gitleaks が無いと既知パターンのfallbackへ
      # 落ちる。CIでは必ず本体を通したいので明示的に入れる。バージョンを固定
      # するのは、ルール追加で既存PRが突然落ちるのを避けるため。更新は手動で行う。
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # gitleaks と同じくバージョンを固定する。apt版はUbuntuイメージ側の都合で
      # 変わり、ローカルと指摘コードがずれる。実際に踏んだ: ローカル0.11.0が
      # SC2329を出す箇所へapt版はSC2317を出し、ローカルで通るPRがCIだけ落ちた。
      - name: Install shellcheck
        env:
          SHELLCHECK_VERSION: "0.11.0"
        run: |
          curl -sSfL -o /tmp/shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp --strip-components=1 \
            "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          sudo install -m 0755 /tmp/shellcheck /usr/local/bin/shellcheck
          shellcheck --version

      # CI=1 を渡すと、toolchain欠如によるskipをerrorへ格上げする。
      # ローカルでskipされた検査がCIでは必ず走るようにして、両者の結果を一致させる。
      # bash構文チェックは `make check` に含めているので個別ステップは持たない。
      - name: Run quality gate
        env:
          CI: "1"
        run: make check

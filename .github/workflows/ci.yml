name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install mingw-w64 (m5stack-pc-bridge Windows Service cross-build)
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # CI=1 を渡すと、toolchain欠如によるskipをerrorへ格上げする。
      # ローカルでskipされた検査がCIでは必ず走るようにして、両者の結果を一致させる。
      # bash構文チェックは `make check` に含めているので個別ステップは持たない。
      - name: Run quality gate
        env:
          CI: "1"
        run: make check

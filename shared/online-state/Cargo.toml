[package]
name = "online-state"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[dependencies]
# `GET /status` 応答の解釈に使う。firmware/m5stack-pc-bridgeは既にserde_jsonを
# 持つが、このcrate単体で `cargo test` できるよう直接依存として宣言する。
serde_json = "1"

[dev-dependencies]
battery = { path = "../battery" }

[lints.cargo]
unused_dependencies = "warn"

[lints.clippy]
missing_const_for_fn = "warn"
